<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: 0; padding: .75rem; border: 1px solid #ccc; border-radius: .25rem; background: #fafafa; font: inherit; }
    #result, #message { margin-top: 1.5rem; }
    #message { padding: .75rem; border-left: .25rem solid #c58a00; background: #fff8e6; }
    dt { font-weight: 600; margin-top: .75rem; }
    dd { margin: .25rem 0 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message-text">Текст заявки</label>
    <textarea id="message-text" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <p id="message" role="status" hidden></p>

  <section id="result" hidden>
    <dl>
      <dt>Тема</dt>
      <dd id="topic"></dd>
      <dt>Черновик ответа</dt>
      <dd><pre id="draft"></pre></dd>
    </dl>
    <p><small>Это черновик от AI. Проверьте его перед отправкой клиенту.</small></p>
  </section>

  <script type="module">
    import { renderPending, renderResult } from "/triage-view.mjs";

    const CLIENT_TIMEOUT_MS = 5000;
    const form = document.querySelector("form");
    const input = document.querySelector("#message-text");
    const button = form.querySelector("button");
    const view = {
      result: document.querySelector("#result"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
      message: document.querySelector("#message"),
    };

    async function requestTriage(text) {
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(CLIENT_TIMEOUT_MS),
        });
        return await reply.json();
      } catch {
        // Network error, client timeout or non-JSON reply: same as manual review.
        return null;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // The button stays disabled while a request is in flight, so a slow reply can never overwrite a newer one.
      renderPending(view);
      button.disabled = true;

      const payload = await requestTriage(input.value);
      renderResult(view, payload);
      button.disabled = false;
    });
  </script>
</body>
</html>
